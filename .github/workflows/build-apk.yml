name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER || secrets.GPR_USER || github.actor }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}
      GPR_USER: ${{ secrets.GPR_USER || secrets.GH_PACKAGES_USER || github.actor }}
      GPR_TOKEN: ${{ secrets.GPR_TOKEN || secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shell and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static dash python3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK and install build-tools
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          sudo chown -R "$(id -un):$(id -gn)" "$SDK_DIR" || true
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(ls -d "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;35.0.0" "platforms;android-36"
          "$SDKMANAGER" --install "build-tools;36.0.0" "platforms;android-37" || true

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Check GitHub Packages Maven access
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 \
            -u "${GH_PACKAGES_USER}:${GH_PACKAGES_TOKEN}" \
            "https://maven.pkg.github.com/tribalfs/oneui-design/io/github/tribalfs/oneui-design/0.9.13+oneui8/oneui-design-0.9.13+oneui8.pom" || echo "000")
          echo "GitHub Packages (tribalfs/oneui-design) HTTP status: $code"
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::warning::GitHub Packages returned HTTP $code using current token. Configure repository secret GH_PACKAGES_TOKEN (or GPR_TOKEN) with a GitHub PAT having read:packages scope if the Gradle cache is cold."
          fi

      - name: Detect release signing secrets and build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x app-android/gradlew scripts/build-guest-manager.sh

          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "Release keystore secrets detected; preparing release build..."
            mkdir -p "$HOME/.oneos-release"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.oneos-release/release.jks"
            printf '%s\n' \
              "storeFile=$HOME/.oneos-release/release.jks" \
              "storePassword=$KEYSTORE_PASSWORD" \
              "keyAlias=$KEY_ALIAS" \
              "keyPassword=$KEY_PASSWORD" \
              > "$HOME/.oneos-release/keystore.properties"
            ./scripts/build-guest-manager.sh release
            (cd app-android && ./gradlew :app:assembleRelease --no-daemon --stacktrace)
            BUILD_VARIANT="release"
          else
            echo "No release keystore secrets configured; running debug build..."
            ./scripts/build-guest-manager.sh debug
            (cd app-android && ./gradlew :app:assembleDebug --no-daemon --stacktrace)
            BUILD_VARIANT="debug"
          fi

          APP_VER="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app-android/app/build.gradle.kts | head -n 1)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          mkdir -p dist/apk
          find app-android/app/build/outputs/apk -type f -name '*.apk' -exec cp {} dist/apk/ \;
          ls -lh dist/apk/
          echo "ARTIFACT_NAME=oneos-apk-v${APP_VER:-0.0.0}-${SHORT_SHA}-${BUILD_VARIANT}" >> "$GITHUB_ENV"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/apk/*.apk
          retention-days: 30
