    
name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "app-android/**"
      - "switcher/**"
      - "scripts/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app-android/**"
      - "switcher/**"
      - "scripts/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Test and build OneOS Probe
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: app-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
       run: |
           yes | sdkmanager --licenses >/dev/null
           sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon --max-workers=3 test

      - name: Run Probe lint
        run: ./gradlew --no-daemon --max-workers=3 lintProbeDebug

      - name: Build OneOS Probe APK
        run: ./gradlew --no-daemon --max-workers=3 assembleProbeDebug

      - name: Upload OneOS Probe APK
        uses: actions/upload-artifact@v4
        with:
          name: OneOS-Probe-debug
          path: app/build/outputs/apk/probe/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
