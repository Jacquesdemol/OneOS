name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "app-android/**"
      - "switcher/**"
      - "scripts/**"
      - ".github/workflows/android.yml"

  pull_request:
    paths:
      - "app-android/**"
      - "switcher/**"
      - "scripts/**"
      - ".github/workflows/android.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Test, lint, and build OneOS Probe
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER || github.actor }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

    defaults:
      run:
        working-directory: app-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install Android 37 platform
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run OneOS Probe and core source-split unit tests
        run: ./gradlew --no-daemon --max-workers=3 :core:model:test :core:safety:test :core:device:testDebugUnitTest :core:root:testDebugUnitTest :app:testProbeDebugUnitTest

      - name: Run OneOS Probe lint
        run: ./gradlew --no-daemon --max-workers=3 :core:device:lintDebug :core:root:lintDebug :app:lintProbeDebug

      - name: Build and verify OneOS Probe APK
        run: ./gradlew --no-daemon --max-workers=3 :app:assembleProbeDebug

      - name: Upload OneOS Probe APK
        uses: actions/upload-artifact@v4
        with:
          name: OneOS-Probe-debug
          path: app-android/app/build/outputs/apk/probe/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Probe test, lint, and APK reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-probe-reports
          path: |
            app-android/**/build/reports/tests/
            app-android/**/build/reports/lint-results-*.html
            app-android/app/build/reports/probe-apk/
          if-no-files-found: ignore
          retention-days: 14

  full:
    name: Test, lint, and build OneOS Full
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER || github.actor }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

    defaults:
      run:
        working-directory: app-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install Android 37 platform
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        run: chmod +x ./gradlew ../scripts/build-guest-manager.sh

      - name: Build and stage Guest Manager
        run: |
          ../scripts/build-guest-manager.sh --debug
          ./gradlew --stop

      - name: Run OneOS Full and core unit tests
        run: ./gradlew --no-daemon --max-workers=3 :core:model:test :core:image:test :core:dex:test :core:safety:test :core:patch:test :core:device:testDebugUnitTest :core:root:testDebugUnitTest :guest:testDebugUnitTest :app:testFullDebugUnitTest

      - name: Run Guest and OneOS Full lint
        run: ./gradlew --no-daemon --max-workers=3 :guest:lintDebug :app:lintFullDebug

      - name: Build and verify OneOS Full APK
        run: ./gradlew --no-daemon --max-workers=3 :app:assembleFullDebug

      - name: Run staging APK regression tests
        run: |
          for apk in app/build/outputs/apk/full/debug/*.apk; do
            python3 ../scripts/test-staging-apk.py "$apk"
          done

      - name: Upload OneOS Full APK
        uses: actions/upload-artifact@v4
        with:
          name: OneOS-Full-debug
          path: app-android/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Full test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-full-reports
          path: |
            app-android/**/build/reports/tests/
            app-android/**/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
