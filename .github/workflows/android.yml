name: Build OneOS APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Native Helpers & Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER || secrets.GPR_USER || github.actor }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}
      GPR_USER: ${{ secrets.GPR_USER || secrets.GH_PACKAGES_USER || github.actor }}
      GPR_TOKEN: ${{ secrets.GPR_TOKEN || secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          sudo chown -R runner:docker $ANDROID_HOME || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "build-tools;35.0.0" "ndk;27.2.12479018" || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-37" || $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" || true

      - name: Run regression & shell checks
        run: |
          sudo apt-get update && sudo apt-get install -y dash busybox-static
          python3 scripts/check-shell.py
          python3 scripts/test-boot-fixes.py

      - name: Build native aarch64 helpers
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          sh switcher/native/build.sh

      - name: Build Guest Manager APK first
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          chmod +x scripts/build-guest-manager.sh
          sh scripts/build-guest-manager.sh debug

      - name: Build Android APK
        working-directory: app-android
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          chmod +x gradlew
          ./gradlew assembleFullDebug

      - name: Locate & inspect built APK
        run: |
          APK_PATH=$(find app-android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Built APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload OneOS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneOS-debug-apk
          path: app-android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
