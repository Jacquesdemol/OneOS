
name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "app-android/**"
      - "switcher/**"
      - "scripts/**"
      - ".github/workflows/android.yml"

  pull_request:
    paths:
      - "app-android/**"
      - "switcher/**"
      - "scripts/**"
      - ".github/workflows/android.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Test and build OneOS Full
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: app-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 platform
        run: sdkmanager "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and stage Guest Manager
        run: ../scripts/build-guest-manager.sh --debug

      - name: Run unit tests
        run: ./gradlew --no-daemon --max-workers=3 test

      - name: Run OneOS Full lint
        run: ./gradlew --no-daemon --max-workers=3 lintFullDebug

      - name: Build OneOS Full APK
        run: ./gradlew --no-daemon --max-workers=3 assembleFullDebug

      - name: Upload OneOS Full APK
        uses: actions/upload-artifact@v4
        with:
          name: OneOS-Full-debug
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
